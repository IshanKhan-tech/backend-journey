<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- DRAPE brand icon: elegant clothes hanger silhouette -->
  <rect width="64" height="64" fill="#0F0F0F"/>
  <!-- Hanger hook arc -->
  <path d="M32 10 C32 10, 40 10, 40 18 C40 22, 36 24, 32 24" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Hanger body -->
  <path d="M32 24 L10 44 L54 44" stroke="#F9F6F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Bottom bar -->
  <line x1="14" y1="44" x2="50" y2="44" stroke="#F9F6F1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Small gold dot on hook top -->
  <circle cx="32" cy="9" r="2.5" fill="#C9A84C"/>
</svg>